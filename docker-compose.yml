# Two containers off one image, sharing the data volume.
#
# The split is not decoration: `extract` blocks on a synchronous subprocess and embedding a
# book is minutes of CPU, either of which would stall every reader's request if it ran in the
# web process. They share a volume because the worker writes into the reader's own database.
services:
  guru:
    build: .
    command: serve
    restart: unless-stopped
    environment:
      # The public URL. Coolify reads this variable to route and to get a certificate; behind
      # any other proxy it is unused and harmless.
      - SERVICE_FQDN_GURU_8080=${GURU_URL:-http://localhost:8080}
      - NODE_ENV=production
      - PORT=8080
      - GURU_STARTER=/app/data/starter.db
      - GURU_USER_DIR=/app/data/users
      - GURU_JOBS_DB=/app/data/jobs.db
      - GURU_UPLOADS=/app/data/uploads
      # Runs without Clerk. Only names the reader if GURU_BASIC_AUTH is empty, in which case
      # the proxy in front MUST authenticate. Swap all this for CLERK_SECRET_KEY +
      # CLERK_PUBLISHABLE_KEY + GURU_ORIGINS the day strangers can sign up.
      - GURU_SINGLE_USER=${GURU_SINGLE_USER:-reader}
      # Comma-separated user:password, e.g. ada:secret,lin:other. Enforced by the
      # app, not the proxy. See the note in src/auth.ts. Without it the app refuses to boot.
      # The username that matches is the reader's id, so each one gets its own library and
      # renaming a username orphans that person's books under the old name.
      - GURU_BASIC_AUTH=${GURU_BASIC_AUTH}
      # Any OpenAI-compatible endpoint. The model ids are optional and the per-provider
      # defaults in src/llm.ts apply when they are unset, which includes being set to the
      # empty string, since `${VAR:-}` below writes one whether or not VAR exists.
      - DEEPINFRA_API_KEY=${DEEPINFRA_API_KEY}
      - DEEPINFRA_BASE_URL=${DEEPINFRA_BASE_URL}
      - GURU_PIPELINE_MODEL=${GURU_PIPELINE_MODEL:-}
      - GURU_ANSWER_MODEL=${GURU_ANSWER_MODEL:-}
    volumes:
      - guru-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      # Only the very first boot embeds the corpus before the port opens: with no starter there
      # is nothing to answer with, and that is hours of CPU. A boot after starter/library.json
      # changes rebuilds in the background and keeps serving the old shelf, so it does not need
      # the window. An earlier 15m window marked the container unhealthy mid-build, and while it
      # recovers on its own, Traefik will not route to it or get a certificate until it does.
      start_period: 120m
      retries: 3

  worker:
    build: .
    command: worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - GURU_STARTER=/app/data/starter.db
      - GURU_USER_DIR=/app/data/users
      - GURU_JOBS_DB=/app/data/jobs.db
      - GURU_UPLOADS=/app/data/uploads
      # The worker serves no requests and never imports auth.ts, but it writes into the
      # reader's database, so it has to agree with the server about who that reader is.
      - GURU_SINGLE_USER=${GURU_SINGLE_USER:-reader}
      # Any OpenAI-compatible endpoint. The model ids are optional and the per-provider
      # defaults in src/llm.ts apply when they are unset, which includes being set to the
      # empty string, since `${VAR:-}` below writes one whether or not VAR exists.
      - DEEPINFRA_API_KEY=${DEEPINFRA_API_KEY}
      - DEEPINFRA_BASE_URL=${DEEPINFRA_BASE_URL}
      - GURU_PIPELINE_MODEL=${GURU_PIPELINE_MODEL:-}
      - GURU_ANSWER_MODEL=${GURU_ANSWER_MODEL:-}
    volumes:
      - guru-data:/app/data

volumes:
  guru-data:
